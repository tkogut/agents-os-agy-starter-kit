version: '3.8'

services:
  agents-os:
    build:
      context: .
      dockerfile: Dockerfile
    image: agents-os:latest
    container_name: agents-os-dev
    user: "${UID:-1000}:${GID:-1000}"
    volumes:
      # HOST_HOME is written to .env by INSTALL.sh — correctly resolves to /home/tkogut or /root
      - ..:/projects
      # Share SSH keys for seamless Git operations
      - ${HOST_HOME:-$HOME}/.ssh:${HOST_HOME:-$HOME}/.ssh:ro
      # Share Github CLI config (tokens, login state)
      - ${HOST_HOME:-$HOME}/.config/gh:${HOST_HOME:-$HOME}/.config/gh:ro
      # Share ~/.antigravity directory containing templates and skills
      - ${HOST_HOME:-$HOME}/.antigravity:${HOST_HOME:-$HOME}/.antigravity
    environment:
      - AGENTS_OS_ENV=devcontainer
      - HOME=${HOST_HOME}
      - PROJECTS_ROOT=${HOST_HOME}/projects
    # Keep container alive, interactive
    stdin_open: true
    tty: true
