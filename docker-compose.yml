version: '3.8'

services:
  agents-os:
    build:
      context: .
      dockerfile: Dockerfile
    image: agents-os:latest
    container_name: agents-os-dev
    user: "${UID:-1000}:${GID:-1000}"
    volumes:
      # Mount projects root directory
      - ..:/home/tkogut/projects
      # Share SSH keys for seamless Git operations
      - ~/.ssh:/home/tkogut/.ssh:ro
      # Share Github CLI config (tokens, login state)
      - ~/.config/gh:/home/tkogut/.config/gh:ro
      # Share ~/.antigravity directory containing templates and skills
      - ~/.antigravity:/home/tkogut/.antigravity
    environment:
      - AGENTS_OS_ENV=devcontainer
      - HOME=/home/tkogut
    # Keep container alive, interactive
    stdin_open: true
    tty: true
